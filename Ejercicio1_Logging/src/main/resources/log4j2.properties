#Definimos como debug o trace si la inicialización de log4j está fallando
status = info
name = ConsoleLogConfigDemo

appender.console.type = Console
appender.console.name = consoleLogger
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p- %m%n

appender.file.type = File
appender.file.name = fileLogger
appender.file.fileName = logs/logger.log 
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5p - %m%n

rootLogger.level = debug
# Appender asociado al rootLogger
rootLogger.appenderRef.console.ref = consoleLogger
rootLogger.appenderRef.file.ref = fileLogger